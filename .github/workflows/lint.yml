name: Lint and Validate Scripts

on:
  push:
    branches: [ main ]
    paths:
      - '**.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.sh'
      - '.github/workflows/lint.yml'

jobs:
  bash-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate syntax with bash -n
        run: |
          for script in $(find . -type f -name "*.sh"); do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: >-
            node_modules
            completions/wiper.zsh
